# Compose project name, set explicitly, and **not `hrms`**.
#
# Two reasons, and the second is the one that bites.
#
# Without any name, Compose names the project after the *directory* —
# `deployment` — so containers become `deployment-postgres-1` and volumes
# `deployment_postgres_data`. Any other project whose compose also lives in a
# folder called `deployment` produces the same names and silently shares the
# same volume. That is not theoretical: this database was once replaced by
# another project's, with no error and matching table names.
#
# And this product was forked from the multi-tenant SaaS HRMS, which uses
# `hrms`. Keeping that name would have hydro's containers, images and volumes
# land on top of the SaaS stack's — the same silent-shared-volume failure,
# between two projects with genuinely identical table names. Everything below
# is named `hrms-hydro` / `hrms_hydro_*` and every host port is offset, so both
# stacks can run at once and neither can be mistaken for the other.
name: hrms-hydro

services:
  postgres:
    image: postgres:16-alpine
    container_name: hrms-hydro-postgres
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
    ports:
      # **Not 5432, and that is deliberate.** This product was forked from a
      # multi-tenant SaaS HRMS that many of us still have running on the same
      # machine, on the conventional ports. Sharing them means the two stacks
      # cannot be up at once and — far worse — that `psql -p 5432` or a stray
      # `DB_PORT` reaches whichever container happened to start first, so a
      # migration lands in the wrong database and nothing says so.
      #
      # Every host port in this file is offset for the same reason. Change one
      # and change its twin in `backend/.env`; they are the same fact written
      # down twice.
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hrms-hydro-redis
    ports:
      # Host 16381, not 6379. Windows reserves 6081-7059 in blocks for
      # Hyper-V dynamic ports, which swallows 6379 and 6380 alike, so the host
      # port has to clear that whole span. Containers still reach each other on
      # 6379 via the service name — only the host mapping moved. The 1 on the
      # end keeps it clear of the SaaS stack's 16380.
      - "16381:6379"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: hrms-hydro-mailhog
    ports:
      - "8026:8025" # web UI
      - "1026:1025" # SMTP

  backend:
    image: hrms-hydro-backend
    container_name: hrms-hydro-backend
    build:
      context: ../backend
      dockerfile: ../deployment/backend/Dockerfile.dev
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      # Stated beside DB_HOST rather than inherited. Inside this network
      # Postgres is `postgres:5432`; on the host it is `127.0.0.1:5432`.
      # Those agree today, and this line is what keeps the container right
      # if the host mapping ever has to move again.
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      # 🔴 **Mail has never worked in this environment.** `EMAIL_HOST`
      # defaults to `localhost`, and inside a container that is the container
      # itself — nothing listens on 1025 there. MailHog is a separate service,
      # so it has to be addressed by its compose name, exactly like `DB_HOST`
      # and `REDIS_URL` above.
      #
      # The failure was silent in the worst way: until this was fixed, an
      # unreachable mail server raised straight out of `notify()`, so a
      # broadcast reached every admin in-app and *then* answered 500.
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Chat WebSockets (Django Channels) — separate Redis DB from Celery.
      # `runserver` serves ASGI automatically because `daphne` is installed
      # (see backend/config/settings/base.py).
      CHANNEL_LAYERS_REDIS_URL: redis://redis:6379/2
    volumes:
      - ../backend:/app
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    image: hrms-hydro-celery-worker
    container_name: hrms-hydro-celery-worker
    build:
      context: ../backend
      dockerfile: ../deployment/backend/Dockerfile.dev
    command: celery -A config worker -l info
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      # Stated beside DB_HOST rather than inherited. Inside this network
      # Postgres is `postgres:5432`; on the host it is `127.0.0.1:5432`.
      # Those agree today, and this line is what keeps the container right
      # if the host mapping ever has to move again.
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      # 🔴 **Mail has never worked in this environment.** `EMAIL_HOST`
      # defaults to `localhost`, and inside a container that is the container
      # itself — nothing listens on 1025 there. MailHog is a separate service,
      # so it has to be addressed by its compose name, exactly like `DB_HOST`
      # and `REDIS_URL` above.
      #
      # The failure was silent in the worst way: until this was fixed, an
      # unreachable mail server raised straight out of `notify()`, so a
      # broadcast reached every admin in-app and *then* answered 500.
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    image: hrms-hydro-celery-beat
    container_name: hrms-hydro-celery-beat
    build:
      context: ../backend
      dockerfile: ../deployment/backend/Dockerfile.dev
    command: celery -A config beat -l info
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      # Stated beside DB_HOST rather than inherited. Inside this network
      # Postgres is `postgres:5432`; on the host it is `127.0.0.1:5432`.
      # Those agree today, and this line is what keeps the container right
      # if the host mapping ever has to move again.
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      # 🔴 **Mail has never worked in this environment.** `EMAIL_HOST`
      # defaults to `localhost`, and inside a container that is the container
      # itself — nothing listens on 1025 there. MailHog is a separate service,
      # so it has to be addressed by its compose name, exactly like `DB_HOST`
      # and `REDIS_URL` above.
      #
      # The failure was silent in the worst way: until this was fixed, an
      # unreachable mail server raised straight out of `notify()`, so a
      # broadcast reached every admin in-app and *then* answered 500.
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: node:22-alpine
    container_name: hrms-hydro-frontend
    working_dir: /app
    # **A production build, not `next dev`.** This container exists to be
    # *tested against*, and the dev server does not survive this machine: over a
    # Windows bind mount, Turbopack plus a polling watcher is heavy enough that
    # Docker reaps it, and its HMR WebSocket fails the upgrade
    # (`ERR_INVALID_HTTP_RESPONSE`). That last part is not cosmetic — measured
    # in a real browser, the served page had **no React handlers attached at
    # all**: no `__reactProps` on the form, no listener on any input. Every
    # click on :3001 was hitting dead HTML, which is what "the cards are
    # unclickable" looks like from the outside.
    #
    # The same check against `next build && next start` attaches React and the
    # whole app is interactive. So the mode was the fault, not the code.
    #
    # The cost is that a source change needs a `docker compose restart frontend`
    # to be picked up, which is the right trade for an environment whose job is
    # to be tried rather than edited.
    # `--prefer-offline` uses the cache rather than re-checking the registry for
    # packages that have not moved; `--no-audit` and `--no-fund` skip two passes
    # that print advice nobody reads during a container start. Together they
    # take the no-op install from about fifteen seconds to two.
    command: >
      sh -c "npm install --prefer-offline --no-audit --no-fund
      && npm run build
      && npm run start -- -p 3000"
    # It still exits silently if the box runs out of memory mid-build, and an
    # exit code of 0 makes that look like a clean shutdown. Restarting is not a
    # fix for the memory use; it is a fix for the *silence*.
    restart: unless-stopped
    environment:
      # **Two URLs, and they are deliberately different.**
      #
      # `NEXT_PUBLIC_*` is compiled into the browser bundle, so it has to be
      # the address a *browser on the host* can reach — the published port.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # This one is used by the BFF routes, which run **inside this container**.
      # There, `localhost` is the container itself, so the default of
      # 127.0.0.1:8000 makes Next.js call itself and every login returns 500
      # with `ECONNREFUSED 127.0.0.1:8000`. It has to be the compose service.
      DJANGO_API_BASE_URL: http://backend:8000
      # 🔴 **These do nothing here, and believing they did cost hours.**
      #
      # The problem is real: Docker Desktop on Windows does not deliver inotify
      # events across a bind mount, so the watcher never fires and the browser
      # keeps serving the previous build — the code is right, the file is right,
      # and the change looks like it was never made.
      #
      # But `WATCHPACK_POLLING` and `CHOKIDAR_USEPOLLING` are **webpack and
      # chokidar** variables, and this is Next 16, where Turbopack is the
      # default bundler (`node_modules/next/dist/docs/.../08-turbopack.md`:
      # "Turbopack is now the default bundler… No configuration is needed").
      # Turbopack has its own watcher and no documented polling option, so
      # nothing reads either of these.
      #
      # Kept, not deleted: they cost nothing, and they become correct again the
      # day anything here runs webpack. The comment is the fix — the previous
      # one asserted these solved the problem, which is why every "I don't see
      # my changes" moment this month ended in a container restart instead of a
      # diagnosis. **The actual fix is to run Next on the host** (S4 in
      # docs/checklist.md), where file events work natively.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # Poll every two seconds rather than the default few hundred
      # milliseconds. Polling means *stat every watched file, every tick*, and
      # at the default rate over a Next project's file count that is a constant
      # load with nothing to show for it — nobody edits a file twice a second.
      WATCHPACK_POLLING_INTERVAL: "2000"
      # 🔴 **Cap the heap, or the container eats the VM and is killed.**
      #
      # Node sizes its heap from the memory it can see, so in an 8 GB VM it
      # will happily grow past 5.5 GB before collecting seriously — and it did:
      # the dev server was repeatedly OOM-killed mid-session, reporting
      # `ENOMEM: not enough memory, scandir` from the watcher on the way down.
      # The failure is nastier than a crash, because a half-dead server keeps
      # answering with the *previous* build, so a change that was applied
      # correctly looks like it was never made.
      #
      # 3 GB is well clear of what a compile actually needs and forces GC long
      # before the VM is in trouble.
      NODE_OPTIONS: "--max-old-space-size=3072"
    volumes:
      - ../frontend:/app
      # 🔴 **The build cache must not live on the bind mount.**
      #
      # Turbopack reads and writes `.next/dev` constantly, and on Docker Desktop
      # for Windows every one of those operations crosses the host filesystem
      # boundary. Next.js detects this and says so on boot — *"Slow filesystem
      # detected… if /app/.next/dev is a network drive, consider moving it to a
      # local folder"* — and the cost is not subtle: a single page was taking
      # **220 seconds** to compile.
      #
      # That is not merely slow, it is *misleading*. Edit a file, refresh before
      # the recompile lands, and the browser serves the previous build — so the
      # change looks like it was never applied. Every "I don't see my changes"
      # report on this project traces back here or to the watcher above.
      #
      # A named volume keeps the cache inside the Linux VM where the container
      # actually runs. Nothing in it is source, so losing it costs one rebuild.
      # **`node_modules` in a named volume, not on the bind mount.**
      #
      # This is the single biggest thing in the build time. `../frontend:/app`
      # crosses the Windows host filesystem, and a Next build reads essentially
      # every file of every one of ~500 packages — each read paying the
      # crossing. The measured build on the host is 81 seconds; in the container
      # it was four to five minutes, and the difference is almost entirely this
      # directory.
      #
      # A named volume lives in the Linux VM, so those reads are local. It also
      # keeps the host's `node_modules` — built against Windows — from being
      # seen by an Alpine container that needs Linux binaries for anything with
      # a native component.
      #
      # It is populated by the `npm install` in the command below and survives
      # restarts, so only a changed `package.json` costs anything.
      - hrms_frontend_modules:/app/node_modules
      - hrms_frontend_next:/app/.next
    ports:
      - "3001:3000"
    depends_on:
      # Not `service_healthy` — the frontend is useful while the backend boots,
      # and Next.js recompiles on demand anyway.
      - backend

volumes:
  hrms_frontend_modules:
    # Named for the same reason as the others: Compose would otherwise derive it
    # from the `deployment/` folder name and collide with any project laid out
    # the same way.
    name: hrms_hydro_frontend_modules
  hrms_frontend_next:
    # Named for the same reason as the database below: compose would otherwise
    # derive it from the `deployment/` folder name and collide with any other
    # project laid out the same way.
    name: hrms_hydro_frontend_next
  postgres_data:
    # Named explicitly. Compose derives volume names from the *project
    # directory*, and this compose lives in a folder called `deployment` — so
    # the default name was `deployment_postgres_data`, which any other project
    # whose compose also sits in a `deployment/` folder would claim too.
    # That collision is not theoretical: it is how this database was silently
    # replaced by another project's, with matching table names and no error.
    #
    # `hydro` in the name, not just `hrms`: the SaaS product this was forked
    # from owns `hrms_postgres_data`, and its tables are named identically.
    name: hrms_hydro_postgres_data
