name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest

    # Real Postgres, not SQLite: the product relies on Postgres-specific
    # behaviour, so the suite runs against the real thing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms
          POSTGRES_DB: hrms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-secret-key-not-used-anywhere-real
      TEST_DB_NAME: hrms_test
      TEST_DB_USER: hrms
      TEST_DB_PASSWORD: hrms
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: System packages
        # WeasyPrint renders payslips and needs cairo/pango at import time,
        # so this is required even for tests that never render a PDF.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Django system checks
        run: python manage.py check

      - name: Missing migrations
        # A model change without a migration breaks the next deploy, not this
        # commit — which is why it has to fail here instead.
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend — types, lint & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build
        env:
          # The landing page fetches CMS content at build time and falls back
          # to built-in copy when the API is unreachable — which it is here.
          DJANGO_API_BASE_URL: http://127.0.0.1:8000
        run: npx next build
